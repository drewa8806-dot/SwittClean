name: SwiftClean Auto-Fix Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Missing Files & Compile APK
      run: |
        echo "⏳ جاري إصلاح ملفات المشروع الناقصة..."
        
        # 1. حل مشكلة مكتبات الأندرويد اللي ظهرت في الصورة
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        
        # 2. إنشاء ملف الثيمات برمجياً لضمان عدم توقف البناء
        mkdir -p app/src/main/res/values
        cat <<EOF > app/src/main/res/values/themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.Material3.DayNight.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar" />
        </resources>
        EOF
        
        echo "🚀 جاري بناء تطبيق الـ APK..."
        chmod +x ./gradlew || true
        gradle assembleDebug --quiet

    - name: Upload Final APK
      uses: actions/upload-artifact@v4
      with:
        name: SwiftCleanPro-APK
        path: '**/*.apk'
