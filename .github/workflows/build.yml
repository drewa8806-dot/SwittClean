name: Build Android APK Auto-Detect

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto-Detect and Build APK
      run: |
        echo "Searching for Android Gradle files..."
        GRADLE_FILE=$(find . -name "build.gradle*" | head -n 1)
        
        if [ -z "$GRADLE_FILE" ]; then
          echo "❌ الكود الحالي لا يحتوي على ملفات أندرويد (Gradle). يبدو أن هذا مشروع ويب (Web App)."
          exit 1
        fi
        
        GRADLE_DIR=$(dirname "$GRADLE_FILE")
        echo "✅ تم العثور على ملفات الأندرويد في المسار: $GRADLE_DIR"
        cd "$GRADLE_DIR"
        
        chmod +x ./gradlew || true
        ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SwiftClean-APK
        path: '**/*.apk'
